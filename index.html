<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
    <script src="calc.js" defer></script>
</head>
<body>
    <header id="top">
        <img src="1ogo.png" alt="Логотип сайта 5uchn34tk1d">

    </header>

    <main id="calc">
        <h1>Калькулятор стоимости заказа</h1>
        <label>
            Количество товара:<br>
            <input id="quantity" name="field-quantity" type="text" placeholder="Введите количество">
        </label><br>
        Товар:<br>
        <label>
            <input id="type-pen" name="field-type" type="radio" value="50" data-name="Ручка" checked>
            Ручка — 50 руб.
        </label><br>
        <label>
            <input id="type-notebook" name="field-type" type="radio" value="120" data-name="Тетрадь">
            Тетрадь — 120 руб.
        </label><br>
        <label>
            <input id="type-folder" name="field-type" type="radio" value="300" data-name="Папка">
            Папка — 300 руб.
        </label><br>
        <br>
        <div id="option-box" hidden>
            <label>
                Обложка:<br>
                <select id="option" name="field-option">
                    <option value="0" data-name="мягкая обложка">Мягкая — +0 руб.</option>
                    <option value="60" data-name="твёрдая обложка">Твёрдая — +60 руб.</option>
                </select>
            </label><br>
            <br>
        </div>
        <div id="property-box" hidden>
            <label>
                <input id="property" name="field-property" type="checkbox" value="20" data-name="с файлами">
                Файлы — +20 руб. за штуку
            </label><br>
            <br>
        </div>
        <button id="add-button" type="button">Добавить в заказ</button>
        <button id="clear-button" type="button">Очистить заказ</button>
        <p id="error"></p>
        <div id="order-box" hidden>
            <table>
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Количество</th>
                        <th>Стоимость</th>
                    </tr>
                </thead>
                <tbody id="order-body"></tbody>
                <tfoot>
                    <tr>
                        <th colspan="2">Итого</th>
                        <th id="order-total"></th>
                    </tr>
                </tfoot>
            </table>
        </div>
        <p id="result"></p>
    </main>

    <footer>
        <p> (c) Саенко М. ^_^</p>
    </footer>
</body>
</html>
