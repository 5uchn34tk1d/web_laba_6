<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
    <link rel="stylesheet" href="style.css">
    <script src="calc.js" defer></script>
</head>
<body>
    <header id="top">
        <img src="1ogo.png" alt="Логотип сайта 5uchn34tk1d">

    </header>

    <main id="calc">
        <h1>Калькулятор стоимости заказа</h1>
        <label>
            Количество товара:<br>
            <input id="quantity" name="field-quantity" type="text" value="1" placeholder="Введите количество">
        </label><br>
        <br>
        Тип товара:<br>
        <label>
            <input type="radio" name="field-type" value="1" checked> Карандаш — 30 руб.
        </label><br>
        <label>
            <input type="radio" name="field-type" value="2"> Товар на выбор из списка
        </label><br>
        <label>
            <input type="radio" name="field-type" value="3"> Ручка — 50 руб.
        </label><br>
        <br>
        <div id="product-block">
            <label>
                Товар:<br>
                <select id="product" name="field-product">
                    <option value="120">Тетрадь — 120 руб.</option>
                    <option value="300">Папка — 300 руб.</option>
                    <option value="450">Ежедневник — 450 руб.</option>
                    <option value="90">Маркер — 90 руб.</option>
                </select>
            </label><br>
            <br>
        </div>
        <div id="property-block">
            <label>
                <input id="property" name="field-property" type="checkbox" value="60"> С гравировкой — +60 руб.
            </label><br>
            <br>
        </div>
        <p id="price"></p>
        <button id="add-button" type="button">Добавить в заказ</button>
        <button id="calc-button" type="button">Рассчитать</button>
        <button id="clear-button" type="button">Очистить заказ</button>
        <p id="error"></p>
        <div id="order-box" hidden>
            <table>
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Количество</th>
                        <th>Стоимость</th>
                    </tr>
                </thead>
                <tbody id="order-body"></tbody>
            </table>
        </div>
        <p id="result"></p>
    </main>

    <footer>
        <p> (c) Саенко М. ^_^</p>
    </footer>
</body>
</html>
